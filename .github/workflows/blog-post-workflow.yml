name: Update blog posts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://imjhy.com/index.xml"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: '<tr><td><a href="$url">$title</a></td><td align="right"><code>$date</code></td></tr>$newline'
